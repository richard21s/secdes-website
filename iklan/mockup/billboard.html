<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Videotron SecDes · Koridor Bisnis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #view{position:absolute;inset:0}
  .strip{width:100%;height:100%;display:flex;align-items:center;gap:26px;padding:0 34px;box-sizing:border-box;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;
    background:radial-gradient(60% 120% at 85% 50%,rgba(37,99,235,.55),transparent 70%),linear-gradient(90deg,#0b1626,#0f1c30)}
  .strip img{height:64px}
  .strip b{font-size:44px;letter-spacing:-.02em;line-height:1.05}
  .strip b em{font-style:normal;color:#60a5fa}
  .strip span{margin-left:auto;padding:14px 22px;border-radius:999px;background:#2563eb;font-weight:700;font-size:26px;white-space:nowrap}
</style></head>
<body>
<div id="view"></div>
<script src="mock.js"></script>
<script>
  // Photo: Unsplash (free licence), night street with a curved LED screen on a corner building.
  const S = makeStage({ photo: '../foto/billboard-kota.jpg', W: 1800, H: 2700, crop: { x: 0, y: 470, w: 1800, h: 1430 } });
  const V = '../video/secdes-videotron.html';
  // the curved main screen: left face shows 0-1240 px of a 1600 x 900 frame, right face the rest
  addScreen(S, { quad: [[31, 689], [455, 799], [453, 1180], [30, 1162]], w: 1240, h: 900, content: { src: V, fw: 1600, fh: 900, ox: 0 }, glow: .06 });
  addScreen(S, { quad: [[455, 799], [583, 850], [580, 1198], [453, 1180]], w: 360, h: 900, content: { src: V, fw: 1600, fh: 900, ox: 1240 }, bright: .82 });
  // lower screen: static SecDes strip
  addScreen(S, { quad: [[48, 1192], [570, 1230], [570, 1405], [46, 1402]], w: 1200, h: 380, content: { html:
    '<div class="strip"><img src="../secdes-logo.png" alt=""><b>Kenali serangan sejak<br><em>percobaan pertama.</em></b><span>secdes.co.id</span></div>' }, glow: .05 });
  addSpill(S, [-200, 560, 1000, 760]);
  // the street-lamp pole stands in front of the lower screen
  addPatch(S, [223, 1196, 16, 320]);
</script>
<script src="../video/sound.js"></script>
</body></html>
