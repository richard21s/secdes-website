<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Layar Lobi Lift SecDes</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#view{position:absolute;inset:0}
/* both screens share one design: slim black bezel with a brushed-metal edge */
.bezel{width:100%;height:100%;border-radius:6px;background:#07090c;box-shadow:inset 0 0 0 4px #5b6068,inset 0 0 0 6px #1a1d22}
.shade{width:100%;height:100%;border-radius:6px;background:rgba(0,0,0,.45);filter:blur(6px)}</style>
</head><body>
<div id="view"></div>
<script src="mock.js"></script>
<script>
  // Photo: Unsplash (free licence), lift lobby with marble walls seen at an angle.
  // The wall plane was measured from the two lift-door frames (both ~1.1 x 2.2 m), so each
  // screen is a 52 x 89 cm portrait panel placed on that plane and warped with its perspective.
  const S = makeStage({ photo: '../foto/lobi2.jpg', W: 1800, H: 1013, crop: { x: 0, y: 150, w: 1200, h: 863 } });
  const V = '../video/secdes-videotron.html';
  const screens = [
    { outer: [[44.1, 330.8], [192.3, 352.3], [192.4, 585.9], [44.5, 580.6]], inner: [[50.2, 337.2], [187.0, 356.8], [187.1, 580.5], [50.6, 575.3]], spill: [-40, 250, 300, 420] },   // left marble panel
    { outer: [[543.6, 403.5], [634.9, 416.8], [634.3, 601.5], [543.1, 598.3]], inner: [[547.2, 408.4], [631.6, 420.5], [631.0, 597.2], [546.8, 594.1]], spill: [490, 340, 200, 320] }, // between the lifts, above the call buttons
  ];
  screens.forEach(({ outer, inner, spill }) => {
    addSpill(S, spill, 'rgba(96,165,250,.32)');
    // soft contact shadow just below and right of the panel, on the wall
    addScreen(S, { quad: outer.map(([x, y]) => [x + 4, y + 6]), w: 520, h: 893, content: { html: '<div class="shade"></div>' } });
    addScreen(S, { quad: outer, w: 520, h: 893, content: { html: '<div class="bezel"></div>' } });
    addScreen(S, { quad: inner, w: 540, h: 960, content: { src: V, fw: 540, fh: 960 }, glow: .07 });
  });
</script>
</body></html>
